# Bootstrap nginx config — HTTP only, no certificate required yet.
# Used for the initial setup, before a Let's Encrypt certificate exists.
# Once deploy/setup.sh's certbot step succeeds, it's replaced by the full
# HTTPS config in deploy/nginx.conf.

server {
    listen 80;
    listen [::]:80;
    server_name explainerstudio.org www.explainerstudio.org;

    root /var/www/explainerstudio/frontend/dist;
    index index.html;

    client_max_body_size 15m;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /avatars/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
