# Nginx config for Explainer Studio.
# Serves the built frontend as static files, proxies /api and /avatars to
# the Node backend running on 127.0.0.1:5000 via systemd. Includes the HTTPS
# server block directly (rather than relying on `certbot --nginx` to edit
# this file automatically, which can fail to detect the server block on some
# setups) — run `sudo certbot certonly --nginx -d ... ` or
# `sudo certbot certonly --webroot ...` to just obtain/renew the certificate
# files this config already points at.
#
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/explainerstudio.org
#          sudo ln -s /etc/nginx/sites-available/explainerstudio.org /etc/nginx/sites-enabled/
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name explainerstudio.org www.explainerstudio.org;

    # Let's Encrypt's http-01 challenge needs to reach this over plain HTTP —
    # only redirect once a certificate actually exists, so the very first
    # `certbot certonly` run (before any cert exists) still works.
    location /.well-known/acme-challenge/ {
        root /var/www/explainerstudio/frontend/dist;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name explainerstudio.org www.explainerstudio.org;

    ssl_certificate /etc/letsencrypt/live/explainerstudio.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/explainerstudio.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/explainerstudio/frontend/dist;
    index index.html;

    client_max_body_size 15m;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /avatars/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }

    # React Router client-side routing — fall back to index.html for any
    # path that isn't a real static file. Password-gated (see /etc/nginx/.htpasswd
    # on the Droplet, generated via `htpasswd -bc /etc/nginx/.htpasswd <user> <pass>`)
    # so only people with the shared credentials can browse the site directly —
    # deliberately does NOT cover /api/ or /avatars/ above, so PayPal webhooks
    # and the Google OAuth callback keep working without a password prompt.
    location / {
        auth_basic "Explainer Studio";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri /index.html;
    }
}
