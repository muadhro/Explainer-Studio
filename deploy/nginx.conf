# Nginx config for Explainer Studio.
# Serves the built frontend as static files, proxies /api and /avatars to
# the Node backend running on 127.0.0.1:5000 via systemd.
#
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/explainerstudio.com
#          sudo ln -s /etc/nginx/sites-available/explainerstudio.com /etc/nginx/sites-enabled/
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (see deploy/setup.sh) to add HTTPS — it rewrites this
# file in place to add the SSL server block and redirect.

server {
    listen 80;
    listen [::]:80;
    server_name explainerstudio.com www.explainerstudio.com;

    root /var/www/explainerstudio/frontend/dist;
    index index.html;

    # generated video/audio files can be large — raise the client body
    # limit isn't needed here since uploads only happen via small JSON
    # (avatar images as base64 go through /api), but keep proxy timeouts
    # generous since video rendering can take a few minutes.
    client_max_body_size 15m;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /avatars/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }

    # React Router client-side routing — fall back to index.html for any
    # path that isn't a real static file.
    location / {
        try_files $uri /index.html;
    }
}
